<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IIT Bombay Event Registration form</title>
    <style>
          *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif}
          body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
           background-image: url(https://images.pexels.com/photos/1169754/pexels-photo-1169754.jpeg);
      
          .container{
            background:#fff;
            width:420px;
            padding:25px 30px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
          }
          .container h2{
            text-align:center;
            margin-bottom:20px;
            color:#333;
          }
          form .input-box{
            margin-bottom:15px;
          }
          form .input-box label{
            display:block;
            margin-bottom:6px;
            color:#555;
            font-size:14px;
          }
          form .input-box input,
          form .input-box select,
          form .input-box textarea{
            width:100%;
            padding:10px;
            border-radius:6px;
            border:1px solid #ccc;
            outline:none;
            transition:0.3s;
          }
          form .input-box input:focus,
          form .input-box select:focus,
          form .input-box textarea:focus{
            border-color:#ff6f61;
          }
          .gender{
            display:flex;
            gap:15px;
            margin-top:5px;
          }
          .gender label{
            font-size:14px;
            color:#444;
          }
          .btn{
            margin-top:20px;
          }
          .btn button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#ff6f61;
            color:#fff;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
          }
          .btn button:hover{
            background:#e85b50;
          }
          .success{
            text-align:center;
            color:green;
            margin-top:15px;
            display:none;
          }
          body{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:
          linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
          url("PASTE_IMAGE_URL_HERE") center/cover no-repeat;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Event Registration</h2>
      <form id="eventForm">
        <div class="input-box">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" required />
        </div>

        <div class="input-box">
          <label>Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="input-box">
          <label>Phone Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
            required
          />
        </div>

        <div class="input-box">
          <label>Gender</label>
          <div class="gender">
            <label><input type="radio" name="gender" required /> Male</label>
            <label><input type="radio" name="gender" /> Female</label>
            <label><input type="radio" name="gender" /> Other</label>
          </div>
        </div>

        <div class="input-box">
          <label>Select Event</label>
          <select required>
            <option value="">-- Choose Event --</option>
            <option>Tech Workshop</option>
            <option>Cultural Fest</option>
            <option>Sports Meet</option>
            <option>Cooking Competition</option>
          </select>
        </div>

        <div class="input-box">
          <label>Message</label>
          <textarea rows="3" placeholder="Any message (optional)"></textarea>
        </div>

        <div class="btn">
          <button type="submit">Register Now</button>
        </div>
      </form>
      <div class="success" id="successMsg">Registration Successful 🎉</div>
    </div>

    <script>
      const form = document.getElementById("eventForm");
      const successMsg = document.getElementById("successMsg");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        successMsg.style.display = "block";
        form.reset();
      });
    </script>
  </body>
</html>
