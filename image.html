```html
<!DOCTYPE html>
<html>
<head>
<title>Photography Gallery</title>

<style>

body{
font-family: Arial;
background:#111;
text-align:center;
color:white;
margin:0;
}

h1{
margin:20px;
}

.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
width:70%;
margin:auto;
}

.gallery img{
width:100%;
cursor:pointer;
border-radius:10px;
transition:0.3s;
}

.gallery img:hover{
transform:scale(1.05);
}

#lightbox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
}

#lightbox img{
max-width:80%;
max-height:80%;
border-radius:10px;
}

.close{
position:absolute;
top:20px;
right:40px;
font-size:40px;
color:white;
cursor:pointer;
}

</style>
</head>


<body>

<h1>My Photography Gallery</h1>

<div class="gallery">

<img src="https://picsum.photos/id/1015/300/200" onclick="openLightbox(this)">
<img src="https://picsum.photos/id/1016/300/200" onclick="openLightbox(this)">
<img src="https://picsum.photos/id/1018/300/200" onclick="openLightbox(this)">
<img src="https://picsum.photos/id/1020/300/200" onclick="openLightbox(this)">
<img src="https://picsum.photos/id/1024/300/200" onclick="openLightbox(this)">
<img src="https://picsum.photos/id/1025/300/200" onclick="openLightbox(this)">
<img src="https://picsum.photos/id/1035/300/200" onclick="openLightbox(this)">
<img src="https://picsum.photos/id/1038/300/200" onclick="openLightbox(this)">
<img src="https://picsum.photos/id/1040/300/200" onclick="openLightbox(this)">

</div>

<div id="lightbox">
<span class="close" onclick="closeLightbox()">×</span>
<img id="lightbox-img">
</div>

<script>

function openLightbox(img){

let lightbox = document.getElementById("lightbox")
let lightboxImg = document.getElementById("lightbox-img")

lightbox.style.display = "flex"
lightboxImg.src = img.src

}

function closeLightbox(){

document.getElementById("lightbox").style.display = "none"

}

</script>

</body>
</html>
